<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Financial Bot · Xingyu</title>
  <meta name="description" content="AI 金融研究助手：回答暴露来源、缺口与能否行动。前端 GitHub Pages，API 硅谷服务器。" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&family=Noto+Sans+SC:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div class="app">
    <aside class="rail">
      <div class="brand">
        <div class="mark">FB</div>
        <div>
          <div class="brand-name">Financial Bot</div>
          <div class="brand-sub">研究助手 · 公开展示</div>
        </div>
      </div>
      <nav class="nav">
        <a class="active" href="#chat">对话</a>
        <a href="#status">状态</a>
        <a href="https://fengbaoyao.github.io/xingyu-portfolio/" target="_blank" rel="noreferrer">作品集</a>
      </nav>
      <div class="rail-foot">
        <div id="apiChip" class="chip">API …</div>
        <div class="hint">前端：GitHub Pages<br/>后端：硅谷 VM</div>
      </div>
    </aside>
    <main>
      <header class="top">
        <div>
          <h1>把不可靠的 Agent 做成可信研究工具</h1>
          <p class="lede">回答必须暴露来源、缺口与能否行动。此页为静态壳，请求直连硅谷 API。</p>
        </div>
        <button id="newChat" class="btn ghost">新对话</button>
      </header>
      <section id="status" class="panel status-panel">
        <div class="row"><span>Health</span><code id="health">—</code></div>
        <div class="row"><span>Capabilities</span><code id="caps">—</code></div>
        <div class="row"><span>API Base</span><code id="apiBase">—</code></div>
      </section>
      <section id="chat" class="chat">
        <div id="messages" class="messages"></div>
        <form id="composer" class="composer">
          <textarea id="input" rows="2" placeholder="例如：帮我快速了解宁德时代最近的基本面风险（Quick）" required></textarea>
          <div class="composer-actions">
            <label class="mode"><input type="radio" name="mode" value="quick" checked /> Quick</label>
            <label class="mode muted" title="公测暂停"><input type="radio" name="mode" value="deep" disabled /> Deep（暂停）</label>
            <button class="btn" type="submit">发送</button>
          </div>
        </form>
      </section>
    </main>
  </div>
  <script src="config.js"></script>
  <script src="app.js"></script>
</body>
</html>
